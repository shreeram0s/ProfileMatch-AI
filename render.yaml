services:
  - type: web
    name: profilematch-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2

  - type: static
    name: profilematch-frontend
    runtime: node
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    rootDir: frontend
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: profilematch-backend
          property: url
