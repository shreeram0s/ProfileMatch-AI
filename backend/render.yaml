services:
  # Backend Service
  - type: web
    name: profilematch-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: profilematch-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: profilematch-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: profilematch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: profilematch-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: profilematch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: profilematch-db
          property: port
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false

databases:
  - name: profilematch-db
    databaseName: magic2_jbjo
    user: magic2_jbjo_user
    region: singapore
    plan: free
